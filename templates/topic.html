<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{SEO_TITLE}}</title>
  <link rel="stylesheet" href="/style.css"/>
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico?v=2">
  <meta name="description" content="{{SEO_DESCRIPTION}}"/>
  <link rel="alternate" type="application/rss+xml" title="TheWrkShop — The Daily" href="https://thewrkshop.com/daily/feed.xml"/>
  <link rel="canonical" href="{{CANONICAL_URL}}"/>
  <meta property="og:site_name" content="TheWrkShop"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="{{SOCIAL_TITLE}}"/>
  <meta property="og:description" content="{{SEO_DESCRIPTION}}"/>
  <meta property="og:url" content="{{CANONICAL_URL}}"/>
  <meta property="og:image" content="{{OG_IMAGE}}"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image" content="{{OG_IMAGE}}"/>
  <script type="application/ld+json">{{JSON_LD}}</script>
  <style>
    .page-hero { background:#3e2c23; color:#f4f1ee; padding:3rem 1rem; text-align:center; }
    .page-hero h1 { font-size:clamp(1.8rem,3vw,2.6rem); margin:0 0 .4rem; line-height:1.2; }
    .page-hero p { opacity:.95; max-width:720px; margin:0 auto; line-height:1.6; }
    .topic-crumbs { max-width:860px; margin:0 auto; padding:1rem 1rem 0; font-size:.9rem; }
    .topic-crumbs a { color:#6b4a36; }
    .topic-wrap { max-width:860px; margin:0 auto; padding:1rem 1rem 3rem; }
    .topic-intro { color:#3e2c23; line-height:1.75; font-size:1.08rem; margin:0 0 1.75rem; }
    .topic-wrap h2.topic-h2 { color:#3e2c23; font-size:1.35rem; margin:2rem 0 .75rem; }
    .topic-grid { display:grid; gap:1rem; }
    @media (min-width: 720px) { .topic-grid--tools { grid-template-columns:1fr 1fr; } }
    .topic-card { background:#f4f1ee; color:#2b2b2b; border:1px solid rgba(0,0,0,.08); border-radius:14px; padding:1.1rem 1.25rem; box-shadow:0 2px 6px rgba(0,0,0,.07); }
    .topic-card--tool { background:#fff; border:2px solid #b08a5a; }
    .topic-card h3 { margin:0 0 .35rem; font-size:1.15rem; line-height:1.3; }
    .topic-card h3 a { color:#3e2c23; text-decoration:none; }
    .topic-card h3 a:hover { text-decoration:underline; }
    .topic-card p { margin:0 0 .4rem; line-height:1.6; }
    .topic-kicker { font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#735640; margin:0 0 .25rem !important; }
    .topic-meta { color:#6b5b53; font-size:.88rem; margin:0 !important; }
    .topic-questions { margin:0; padding-left:1.2rem; line-height:1.9; }
    .topic-questions a { color:#3e2c23; font-weight:600; }
    .topic-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:0; padding:0; list-style:none; }
    .topic-chips a { display:inline-block; padding:.4rem .8rem; border-radius:999px; background:#efe6dd; color:#3e2c23; text-decoration:none; font-weight:600; font-size:.92rem; }
    .topic-chips a:hover { background:#e2d3c4; }
    .topic-chips .topic-count { font-weight:400; color:#6b5b53; }
    .topic-index { display:grid; gap:1rem; }
    @media (min-width: 720px) { .topic-index { grid-template-columns:1fr 1fr; } }
  </style>
  <!-- Google Analytics (same GA4 property as the homepage's Firebase analytics) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N48478JV2Z"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N48478JV2Z');</script>
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <h1>{{H1}}</h1>
    <p>{{HERO_SUB}}</p>
  </section>

  {{CRUMBS_HTML}}

  <main class="topic-wrap">
{{BODY_HTML}}

    <section class="daily-signup" aria-labelledby="topicSignupTitle">
      <h3 id="topicSignupTitle">Get The Daily in your inbox</h3>
      <p>One Scripture, one hard question and one step, every weekday morning.</p>
      <form class="daily-signup-form" novalidate>
        <input type="text" name="first_name" placeholder="First name (optional)" autocomplete="given-name" maxlength="60" />
        <input type="email" name="email" placeholder="Your email" autocomplete="email" required />
        <input type="text" name="company" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit">Send Me the Daily</button>
      </form>
      <p class="daily-signup-msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <nav class="footer-links" aria-label="Browse">
        <a href="/upstream/">Start Here</a>
        <a href="/daily.html">The Daily</a>
        <a href="/topics/">Topics</a>
        <a href="/leadership/">Leadership</a>
        <a href="/get-known.html">Groups</a>
        <a href="/library/">Library</a>
        <a href="/blog-archive.html">Blog</a>
        <a href="/podcasts.html">Podcast</a>
        <a href="/resources.html">Resources</a>
        <a href="/#contact">Contact</a>
        <a href="/privacy/">Privacy</a>
      </nav>
      <div class="footer-logo"><img src="/assets/images/thewrkshop-logo-transparent-trimmed.png" alt="TheWrkShop" width="233" height="180"></div>
      <p>&copy; 2026 <span class="sitename">TheWrkShop</span>. All rights reserved.</p>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
