[build]
  command = "npm run build:all"
  publish = "."

[build.environment]
  NODE_VERSION = "22"
  TZ = "America/Chicago"

[[headers]]
  for = "/data/*"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
  for = "/blog/*"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
  for = "/daily/*"
  [headers.values]
  Cache-Control = "no-store"

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "SAMEORIGIN"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
  Strict-Transport-Security = "max-age=31536000"

# Keep admin and login pages out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[functions]
  node_bundler = "esbuild"


# Two Dailies were stored with the wrong date (Oct 2026 fix); keep their old addresses working
[[redirects]]
  from = "/daily/2-Timothy-1-7_fear-is-a-thief_2025-09-18.html"
  to = "/daily/2-Timothy-1-7_fear-is-a-thief_2025-09-30.html"
  status = 301

[[redirects]]
  from = "/daily/2-Corinthians-5-7_faith-isnt-a-feeling_2025-09-18.html"
  to = "/daily/2-Corinthians-5-7_faith-isnt-a-feeling_2025-10-01.html"
  status = 301
